name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check the log, deployed commit, and build for anything broken
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             echo "=== deployed commit ===" && \
             cat storage/app/.deployed_commit 2>/dev/null || git rev-parse HEAD 2>/dev/null || echo "(no marker)" && \
             echo "=== laravel.log file info ===" && \
             ls -la storage/logs/laravel.log 2>/dev/null || echo "(no log file)" && \
             echo "=== ERROR/CRITICAL lines from the last 3 days ===" && \
             grep -E "^\[2026-09-(1[0-2])" storage/logs/laravel.log | grep -E "ERROR|CRITICAL|EMERGENCY" | tail -n 80 || echo "(none found)" && \
             echo "=== public/build manifest present? ===" && \
             ls -la public/build/manifest.json 2>/dev/null || echo "MISSING — this breaks every page including login" && \
             echo "=== config cache timestamp vs .env ===" && \
             ls -la bootstrap/cache/config.php .env 2>/dev/null && \
             echo "=== can the app even boot? artisan about ===" && \
             php artisan about 2>&1 | head -n 40'
