name: Decide mariam/hassan driver names (manual)

# One-off ops workflow. Records the owner's decision on the Wanaan Driver
# names screen (/app/limousine/driver-names) for two still-undecided logins:
#   - "mariam" -> office (no matching entry in the driver register; she is
#     also the heaviest booking-enterer in the whole history)
#   - "hassan" -> the real, ACTIVE driver record "Hassan Makhlooq"
# Goes through the same DriverAliases::save() the screen itself calls, so it
# is recorded exactly as a manual decision would be (auto=false, sticky,
# reversible any time from that screen). Manual only (workflow_dispatch);
# never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: fix-driver-names
  cancel-in-progress: false

jobs:
  fix:
    name: Decide on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Record the decisions
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$bs = chr(92);
               \$workspaceClass = \"App\".\$bs.\"Models\".\$bs.\"Workspace\";
               \$wsMgrClass = \"App\".\$bs.\"Erp\".\$bs.\"Tenancy\".\$bs.\"WorkspaceManager\";
               \$aliasesClass = \"Modules\".\$bs.\"Limousine\".\$bs.\"Support\".\$bs.\"DriverAliases\";
               \$all = \$workspaceClass::all();
               \$matches = [];
               foreach (\$all as \$w) { if (str_contains(strtolower(\$w->name), \"wanaan\")) { \$matches[] = \$w; } }
               if (count(\$matches) !== 1) { echo \"AMBIGUOUS OR NONE - STOPPING\".PHP_EOL; exit(1); }
               \$ws = \$matches[0];
               echo \"WORKSPACE \".\$ws->id.\" \".\$ws->name.PHP_EOL;
               \$mgr = app(\$wsMgrClass);
               \$mgr->withTenant(\$ws->databasePath(), function () use (\$aliasesClass) {
                 \$usersHit = DB::table(\"users\")->where(function (\$q) {
                   \$q->whereRaw(\"lower(name) like ?\", [\"%mariam%\"])->orWhereRaw(\"lower(email) like ?\", [\"mariam%\"]);
                 })->get([\"id\", \"name\", \"email\"]);
                 foreach (\$usersHit as \$u) { echo \"USERS MATCH FOR mariam: id=\".\$u->id.\" name=[\".\$u->name.\"] email=[\".(\$u->email ?? \"NULL\").\"]\".PHP_EOL; }
                 if (count(\$usersHit) === 0) { echo \"NO users ROW MATCHES mariam\".PHP_EOL; }

                 \$aliases = app(\$aliasesClass);
                 \$candidates = \$aliases->candidates();
                 \$choices = [];
                 foreach (\$candidates as \$row) {
                   if (\$row[\"key\"] === \"mariam\") {
                     \$choices[\$row[\"slug\"]] = \"office\";
                     echo \"MATCHED mariam slug=\".\$row[\"slug\"].\" trips=\".\$row[\"trips\"].PHP_EOL;
                   }
                   if (\$row[\"key\"] === \"hassan\") {
                     \$choices[\$row[\"slug\"]] = \"59\";
                     echo \"MATCHED hassan slug=\".\$row[\"slug\"].\" trips=\".\$row[\"trips\"].PHP_EOL;
                   }
                 }
                 if (count(\$choices) !== 2) {
                   echo \"DID NOT FIND BOTH CANDIDATES - ABORTING, NOTHING SAVED\".PHP_EOL;
                   return;
                 }
                 \$result = \$aliases->save(\$choices, \$candidates, \"owner-decision-2026-09-13\");
                 echo \"SAVE RESULT drivers=\".\$result[\"drivers\"].\" office=\".\$result[\"office\"].\" undecided=\".\$result[\"undecided\"].PHP_EOL;

                 \$verify = DB::table(\"limo_driver_aliases\")->whereIn(\"alias\", [\"mariam\", \"hassan\"])->get();
                 foreach (\$verify as \$r) {
                   echo \"VERIFY alias=[\".\$r->alias.\"] driver_id=[\".(\$r->driver_id ?? \"NULL\").\"] is_office=[\".(\$r->is_office ? 1 : 0).\"] auto=[\".(\$r->auto ? 1 : 0).\"] decided_by=[\".(\$r->decided_by ?? \"NULL\").\"]\".PHP_EOL;
                 }
               });
             "'
