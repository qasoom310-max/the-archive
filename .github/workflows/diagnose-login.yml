name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Find where the 3 missing accounts actually live
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$emails = [\"hasan.fuad@hotmail.com\", \"hamdanabbas98@gmail.com\", \"reservations@wanaan-bh.com\"];
               \$mgr = app(App\Erp\Tenancy\WorkspaceManager::class);
               foreach (App\Models\Workspace::query()->get() as \$ws) {
                 if (\$ws->is_main) { continue; }
                 \$path = \$ws->databasePath();
                 if (\$path === null || ! is_file(\$path)) { echo \"workspace {\$ws->id} ({\$ws->name}): file missing\".PHP_EOL; continue; }
                 \$mgr->withTenant(\$path, function () use (\$ws, \$emails): void {
                   foreach (\$emails as \$email) {
                     \$u = App\Models\User::query()->where(\"email\", \$email)->first();
                     if (\$u !== null) {
                       echo \"FOUND {\$email} in workspace {\$ws->id} ({\$ws->name}): id={\$u->id} admin=\".(\$u->is_admin?1:0).\" home=\".(\$u->home_workspace_id ?? \"null\").\" password_len=\".strlen((string)\$u->password).\" created_at=\".\$u->created_at.\" updated_at=\".\$u->updated_at.PHP_EOL;
                     }
                   }
                 });
               }
             "'
