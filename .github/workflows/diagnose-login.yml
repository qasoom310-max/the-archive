name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Simulate accessibleFor() for every account on Main
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$mgr = app(App\Erp\Tenancy\WorkspaceManager::class);
               foreach (App\Models\User::query()->orderBy(\"id\")->get() as \$u) {
                 try {
                   \$acc = \$mgr->accessibleFor(\$u);
                   \$names = \$acc->map(fn (\$w) => \$w->name)->implode(\", \");
                   echo \"user {\$u->id} [{\$u->name}] email=\".(\$u->email ?? \"NULL\").\" admin=\".(\$u->is_admin?1:0).\" super=\".(\$u->is_super_admin?1:0).\" home=\".(\$u->home_workspace_id ?? \"null\").\" paused=\".(\$u->is_paused?1:0).\" => accessible[{\$acc->count()}]: {\$names}\".PHP_EOL;
                 } catch (\Throwable \$e) {
                   echo \"user {\$u->id} [{\$u->name}] THREW: \".get_class(\$e).\": \".\$e->getMessage().PHP_EOL;
                 }
               }
             "'
