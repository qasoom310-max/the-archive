<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenERP">
  <title>OpenERP</title>
  <defs>
    <linearGradient id="oerpTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5c7e"/>
      <stop offset="1" stop-color="#5d3e55"/>
    </linearGradient>
    <clipPath id="oerpClip">
      <rect x="4" y="4" width="56" height="56" rx="15"/>
    </clipPath>
  </defs>

  <!-- Rounded app-tile in the brand aubergine -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#oerpTile)"/>
  <!-- Soft diagonal sheen, clipped to the tile's rounded corners -->
  <g clip-path="url(#oerpClip)">
    <path d="M4 4 H60 V26 L4 40 Z" fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- Modular grid: three seated modules + one sliding into its slot
       (the faded, offset tile) — the platform's "addons" metaphor. -->
  <g fill="#ffffff">
    <rect x="16" y="16" width="13" height="13" rx="3.5"/>
    <rect x="35" y="16" width="13" height="13" rx="3.5"/>
    <rect x="16" y="35" width="13" height="13" rx="3.5"/>
  </g>
  <rect x="37" y="37" width="13" height="13" rx="3.5" fill="#ffffff" opacity="0.5"/>
</svg>
