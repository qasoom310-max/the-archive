name: Diagnose login issue (manual)

# Diagnostics (and, in the final step, a targeted repair) for "nobody but
# the super admin can sign in". Manual only (workflow_dispatch); never
# runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify the 3 repaired accounts now have a real Main row
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$emails = [\"hasan.fuad@hotmail.com\", \"hamdanabbas98@gmail.com\", \"reservations@wanaan-bh.com\"];
               foreach (\$emails as \$email) {
                 \$u = App\Models\User::query()->where(\"email\", \$email)->first();
                 if (\$u === null) { echo \"{\$email}: STILL MISSING\".PHP_EOL; continue; }
                 echo \"{\$email}: OK id={\$u->id} name={\$u->name} password_len=\".strlen((string)\$u->password).\" admin=\".(\$u->is_admin?1:0).\" home=\".(\$u->home_workspace_id ?? \"null\").PHP_EOL;
               }
             "'
