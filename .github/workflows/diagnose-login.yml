name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Reproduce a nested withTenant(withMain()) write from inside workspace 7
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$mgr = app(App\Erp\Tenancy\WorkspaceManager::class);
               \$ws = App\Models\Workspace::find(7);
               echo \"before: default=\".DB::getDefaultConnection().PHP_EOL;
               \$mgr->withTenant(\$ws->databasePath(), function () use (\$mgr) {
                 echo \"inside withTenant: default=\".DB::getDefaultConnection().PHP_EOL;
                 \$mgr->withMain(function () {
                   echo \"inside nested withMain: default=\".DB::getDefaultConnection().PHP_EOL;
                   \$id = DB::table(\"users\")->insertGetId([\"name\"=>\"diag-probe\",\"email\"=>\"diag-probe@example.invalid\",\"password\"=>\"x\",\"created_at\"=>now(),\"updated_at\"=>now()]);
                   echo \"wrote id={\$id} while default was \".DB::getDefaultConnection().PHP_EOL;
                 });
                 echo \"back inside withTenant after nested withMain: default=\".DB::getDefaultConnection().PHP_EOL;
               });
               echo \"after: default=\".DB::getDefaultConnection().PHP_EOL;
               echo \"--- where did diag-probe land? ---\".PHP_EOL;
               echo \"on MAIN (current default, \".DB::getDefaultConnection().\"): count=\".App\Models\User::query()->where(\"email\",\"diag-probe@example.invalid\")->count().PHP_EOL;
               \$mgr->withTenant(\$ws->databasePath(), function () {
                 echo \"inside workspace 7: count=\".DB::table(\"users\")->where(\"email\",\"diag-probe@example.invalid\")->count().PHP_EOL;
                 DB::table(\"users\")->where(\"email\",\"diag-probe@example.invalid\")->delete();
               });
               DB::table(\"users\")->where(\"email\",\"diag-probe@example.invalid\")->delete();
               echo \"cleaned up both places\".PHP_EOL;
             "'
