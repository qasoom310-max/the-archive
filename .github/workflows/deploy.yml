name: CI + Deploy to Hostinger

# Push to main → run quality gates → if green, build + ship to erp.wanaan-bh.com.
# Pull requests run the test job only (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you trigger a manual deploy from the Actions tab

# Avoid two deploys racing if you push twice quickly. The newer one wins;
# the older one is cancelled before its rsync starts.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Quality gates — PHPStan level 6 + full PHPUnit suite.
  # Mirrors `composer check` so what's green locally is green in CI.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: PHPStan + PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 matches Hostinger production (PHP 8.3.30, verified 2026-05-20).
          # Dev host is still 8.2.12 per CLAUDE.md §6, but composer.json requires
          # `^8.2` so both work; CI mirroring prod catches 8.3-specific issues
          # before they ship.
          php-version: '8.3'
          extensions: gd, zip, sqlite3, pdo_mysql, pdo_sqlite, mbstring, xml, bcmath, intl, fileinfo, openssl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer deps (with dev)
        run: composer install --no-progress --prefer-dist --no-interaction

      # Bootstrap a throwaway .env for the test run. Production .env lives on
      # the Hostinger host and is never in the repo — CI needs its own. Without
      # an APP_KEY, anything that touches encryption (sessions, encrypted DB
      # casts, view-rendered tests) blows up with "No application encryption
      # key has been specified." Laravel's `key:generate` writes a base64 key
      # into the just-copied .env so the rest of the job can boot the app.
      - name: Bootstrap .env (test-only)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Build the Vite manifest. Several feature tests render full pages
      # whose layout includes @vite(...) — without public/build/manifest.json
      # they throw ViteManifestNotFound (per CLAUDE.md §3). PHPStan doesn't
      # need this, but PHPUnit's view-render tests do.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build Vite manifest
        run: npm run build

      - name: Composer analyse (PHPStan level 6)
        run: composer analyse

      - name: Composer test (PHPUnit)
        run: composer test

  # ─────────────────────────────────────────────────────────────────────
  # Deploy — only on push to main, only after `test` passes.
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hostinger (erp.wanaan-bh.com)
    runs-on: ubuntu-latest
    needs: test
    # Don't deploy on pull_request even if tests pass — only on main pushes
    # and manual dispatches.
    if: github.event_name != 'pull_request'
    environment:
      name: production
      url: https://erp.wanaan-bh.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 (production extensions)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, sqlite3, pdo_mysql, pdo_sqlite, mbstring, xml, bcmath, intl, fileinfo, openssl
          coverage: none
          tools: composer:v2

      # Build PHP artifacts: production composer install, no dev deps, optimized autoloader.
      - name: Composer install (production)
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-progress \
            --prefer-dist \
            --no-interaction

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build frontend (Vite → public/build/)
        run: npm run build

      # Bring the SSH key into the runner's agent. The key itself lives in
      # the SSH_PRIVATE_KEY repo secret; nothing about it ever appears in
      # logs or in the repo.
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # rsync the project to Hostinger. Important excludes:
      #   - .git*, tests, node_modules: dev-only weight
      #   - .env: never overwrite the prod .env from the repo
      #   - database/database.sqlite: dev-only DB; prod uses MySQL
      #   - storage/app/public/pos_products/: user uploads (per-host data)
      #   - storage/logs/, framework caches: per-host runtime data
      # --delete prunes remote files that no longer exist locally (clean
      # deploys), but `--exclude` paths are protected on BOTH sides — so
      # uploaded photos and prod-only files survive.
      - name: Rsync to Hostinger
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='database/database.sqlite' \
            --exclude='database/*.sqlite-journal' \
            --exclude='storage/app/public/pos_products/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/framework/testing/' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # Remote post-deploy: link storage, run pending migrations, refresh
      # caches. NOTE: `migrate --force` here runs CORE migrations only;
      # per project memory `post-install-module-migrations-not-auto-applied`,
      # each module's migrations are NOT in the default migrate path —
      # those run manually via SSH the first time each module is installed.
      # On subsequent module migrations: SSH in and run
      # `php artisan migrate --path=Modules/<Name>/database/migrations --force`.
      - name: Remote post-deploy
        run: |
          # ln -sfn (not `php artisan storage:link`) — Hostinger disables
          # PHP's exec() in shared-hosting php.ini, and Laravel's storage:link
          # shells out via exec() to create the symlink. The OS-level `ln`
          # bypasses that restriction. -s = symbolic, -f = replace existing,
          # -n = don't follow the target if dst is already a symlink (avoids
          # accidentally creating a link inside an existing link target).
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             ln -sfn ${{ secrets.DEPLOY_PATH }}/storage/app/public ${{ secrets.DEPLOY_PATH }}/public/storage && \
             php artisan migrate --force && \
             php artisan optimize:clear && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             php artisan event:cache"
