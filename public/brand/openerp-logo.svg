<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" role="img" aria-label="OpenERP — Modular ERP">
  <title>OpenERP — Modular ERP</title>
  <defs>
    <linearGradient id="oerpTile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5c7e"/>
      <stop offset="1" stop-color="#5d3e55"/>
    </linearGradient>
    <clipPath id="oerpClip2">
      <rect x="4" y="4" width="56" height="56" rx="15"/>
    </clipPath>
  </defs>

  <!-- Icon mark (scaled to 48px, vertically centred) -->
  <g transform="translate(4 8) scale(0.75)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#oerpTile2)"/>
    <g clip-path="url(#oerpClip2)">
      <path d="M4 4 H60 V26 L4 40 Z" fill="#ffffff" opacity="0.07"/>
    </g>
    <g fill="#ffffff">
      <rect x="16" y="16" width="13" height="13" rx="3.5"/>
      <rect x="35" y="16" width="13" height="13" rx="3.5"/>
      <rect x="16" y="35" width="13" height="13" rx="3.5"/>
    </g>
    <rect x="37" y="37" width="13" height="13" rx="3.5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="37" font-family="'Inter','Segoe UI',Roboto,Arial,sans-serif"
        font-size="27" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#412d3c">Open</tspan><tspan fill="#875a7b">ERP</tspan>
  </text>
  <!-- Tagline -->
  <text x="66" y="51" font-family="'Inter','Segoe UI',Roboto,Arial,sans-serif"
        font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#9f7390">MODULAR ERP</text>
</svg>
