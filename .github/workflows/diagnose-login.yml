name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check the sessions/cache/rate-limiter tables directly
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             echo "=== sessions table: row count + newest 5 ===" && \
             php artisan tinker --execute="
               echo \"count=\".DB::table(\"sessions\")->count().PHP_EOL;
               foreach (DB::table(\"sessions\")->orderByDesc(\"last_activity\")->limit(5)->get([\"id\",\"user_id\",\"last_activity\",\"ip_address\"]) as \$s) {
                 echo json_encode(\$s).\" (\".date(\"Y-m-d H:i:s\", \$s->last_activity).\")\".PHP_EOL;
               }
             " && \
             echo "=== cache table: row count + any login: keys ===" && \
             php artisan tinker --execute="
               echo \"count=\".DB::table(\"cache\")->count().PHP_EOL;
               foreach (DB::table(\"cache\")->where(\"key\",\"like\",\"%login%\")->limit(10)->get([\"key\",\"expiration\"]) as \$c) { echo json_encode(\$c).PHP_EOL; }
             " && \
             echo "=== can a fresh DB write actually happen right now? ===" && \
             php artisan tinker --execute="
               try {
                 \$id = DB::table(\"activity_logs\")->insertGetId([\"action\"=>\"diagnostic_probe\",\"description\"=>\"login-incident check\",\"created_at\"=>now()]);
                 echo \"write OK, id={\$id}\".PHP_EOL;
                 DB::table(\"activity_logs\")->where(\"id\",\$id)->delete();
                 echo \"cleanup OK\".PHP_EOL;
               } catch (\Throwable \$e) { echo \"WRITE FAILED: \".get_class(\$e).\": \".\$e->getMessage().PHP_EOL; }
             " && \
             echo "=== session + queue config actually in effect ===" && \
             php artisan tinker --execute="echo \"session.driver=\".config(\"session.driver\").\" session.connection=\".(config(\"session.connection\") ?? \"default\").\" session.domain=\".(config(\"session.domain\") ?? \"null\").\" session.secure=\".(config(\"session.secure_cookie\")?1:0).\" APP_URL=\".config(\"app.url\").PHP_EOL;"'
