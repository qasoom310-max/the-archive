name: Review duplicate limousine trips (manual)

# Read-only. The detailed, money-aware twin of "Find duplicate limousine
# trips" — for the trips that look like an accidental duplicate, this also
# checks whether either side already has an invoice or receipt attached, so
# a group with money on one side (almost certainly two real, separately
# billed trips) is clearly told apart from a group with nothing recorded at
# all (the strongest candidates for a genuine mistake). Writes nothing —
# this is a shortlist for a human to look at, not a confirmed defect list or
# an instruction to delete anything. Check the run's log for the report.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace id ("" for every database)'
        required: false
        default: '7'

concurrency:
  group: review-duplicate-trips
  cancel-in-progress: false

jobs:
  report:
    name: Report on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run limo:review-duplicate-trips
        env:
          WS: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          case "$WS" in (*[!0-9]*) echo "workspace must be a number or blank"; exit 1;; esac
          OPT=""
          if [ -n "$WS" ]; then OPT="--workspace=$WS"; fi

          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan limo:review-duplicate-trips $OPT"
