name: Limo booking import diagnostic (manual)

# One-off, READ-ONLY. Shows how Wanaan's (workspace 7) limousine bookings are
# stored, so the old system's booking exports can be mapped onto the same
# shape before anything is imported. Writes nothing. Manual only.
on:
  workflow_dispatch:

concurrency:
  group: limo-booking-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload script
        run: |
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            .github/scripts/limo-booking-diagnostic.php \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:limo-booking-diagnostic.php

      - name: Run diagnostic
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && php artisan tinker --execute="require getenv(\"HOME\").\"/limo-booking-diagnostic.php\";"; rc=$?; rm -f ~/limo-booking-diagnostic.php; exit $rc'
