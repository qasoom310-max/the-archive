name: CI + Deploy to Hostinger

# Push to main → run quality gates → if green, build + ship to erp.wanaan-bh.com.
# Pull requests run the test job only (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you trigger a manual deploy from the Actions tab

# Avoid two deploys racing if you push twice quickly. The newer one wins;
# the older one is cancelled before its rsync starts.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Quality gates — PHPStan level 6 + full PHPUnit suite.
  # Mirrors `composer check` so what's green locally is green in CI.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: PHPStan + PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 matches Hostinger production (PHP 8.3.30, verified 2026-05-20).
          # Dev host is still 8.2.12 per CLAUDE.md §6, but composer.json requires
          # `^8.2` so both work; CI mirroring prod catches 8.3-specific issues
          # before they ship.
          php-version: '8.3'
          extensions: gd, zip, sqlite3, pdo_mysql, pdo_sqlite, mbstring, xml, bcmath, intl, fileinfo, openssl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer deps (with dev)
        run: composer install --no-progress --prefer-dist --no-interaction

      # Bootstrap a throwaway .env for the test run. Production .env lives on
      # the Hostinger host and is never in the repo — CI needs its own. Without
      # an APP_KEY, anything that touches encryption (sessions, encrypted DB
      # casts, view-rendered tests) blows up with "No application encryption
      # key has been specified." Laravel's `key:generate` writes a base64 key
      # into the just-copied .env so the rest of the job can boot the app.
      - name: Bootstrap .env (test-only)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Build the Vite manifest. Several feature tests render full pages
      # whose layout includes @vite(...) — without public/build/manifest.json
      # they throw ViteManifestNotFound (per CLAUDE.md §3). PHPStan doesn't
      # need this, but PHPUnit's view-render tests do.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build Vite manifest
        run: npm run build

      - name: Composer analyse (PHPStan level 6)
        run: composer analyse

      - name: Composer test (PHPUnit)
        run: composer test

  # ─────────────────────────────────────────────────────────────────────
  # Deploy — only on push to main, only after `test` passes.
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hostinger (erp.wanaan-bh.com)
    runs-on: ubuntu-latest
    needs: test
    # Don't deploy on pull_request even if tests pass — only on main pushes
    # and manual dispatches.
    if: github.event_name != 'pull_request'
    environment:
      name: production
      url: https://erp.wanaan-bh.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 (production extensions)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, sqlite3, pdo_mysql, pdo_sqlite, mbstring, xml, bcmath, intl, fileinfo, openssl
          coverage: none
          tools: composer:v2

      # Build PHP artifacts: production composer install, no dev deps, optimized autoloader.
      - name: Composer install (production)
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-progress \
            --prefer-dist \
            --no-interaction

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build frontend (Vite → public/build/)
        run: npm run build

      # Bring the SSH key into the runner's agent. The key itself lives in
      # the SSH_PRIVATE_KEY repo secret; nothing about it ever appears in
      # logs or in the repo.
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Print the runner's public IPv4 so Hostinger can check whether this
      # source IP is being blocked by their firewall/fail2ban. NOTE: GitHub
      # rotates runner IPs per-run, so this is only the *current* one — a
      # durable fix is whitelisting GitHub's published Actions ranges.
      - name: Print runner public IP (for Hostinger firewall check)
        run: |
          echo "=== GitHub Actions runner public IPv4 ==="
          curl -s --max-time 10 https://api.ipify.org \
            || curl -s --max-time 10 https://ifconfig.me \
            || curl -s --max-time 10 https://checkip.amazonaws.com
          echo
          echo "=========================================="

      # Definitive reachability probe: can this runner open a raw TCP socket
      # to the deploy host's SSH port at all? Separates a network/firewall
      # block (TCP can't open) from an SSH-level problem (TCP opens, auth/host
      # key fails). Non-fatal — always continues so the real deploy still runs.
      - name: Probe TCP reachability to deploy host
        continue-on-error: true
        run: |
          echo "Outbound sanity (github.com:443):"
          timeout 10 bash -c 'exec 3<>/dev/tcp/140.82.112.3/443' \
            && echo "OUTBOUND_OK" || echo "OUTBOUND_FAIL"
          echo "Deploy host SSH port:"
          timeout 20 bash -c 'exec 3<>/dev/tcp/${{ secrets.SSH_HOST }}/${{ secrets.SSH_PORT }}' \
            && echo "DEPLOY_HOST_TCP_OPEN" || echo "DEPLOY_HOST_TCP_BLOCKED_OR_TIMEOUT"

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          # `|| true` so a flaky keyscan (host briefly unreachable from
          # GitHub's IPs, occasional rate-limit on unauthenticated probes)
          # doesn't fail the whole deploy. The actual rsync + ssh commands
          # below use `StrictHostKeyChecking=accept-new`, which trusts the
          # host fingerprint on first contact — so even with an empty
          # known_hosts the deploy still goes through.
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # rsync the project to Hostinger. Important excludes:
      #   - .git*, tests, node_modules: dev-only weight
      #   - .env: never overwrite the prod .env from the repo
      #   - database/database.sqlite: dev-only DB; prod uses MySQL
      #   - storage/app/public/{avatars,pos_products,pos_categories,partners}/:
      #     ALL four user-upload buckets the FormImageUploadController
      #     whitelists. --delete would wipe them on every deploy and
      #     leave DB rows pointing at gone files (regression observed
      #     2026-05-24 — user avatars disappeared after a deploy because
      #     only pos_products/ was protected). Add the bucket name here
      #     in lockstep with any new entry in FormImageUploadController.
      #   - storage/logs/, framework caches: per-host runtime data
      # --delete prunes remote files that no longer exist locally (clean
      # deploys), but `--exclude` paths are protected on BOTH sides — so
      # uploaded photos and prod-only files survive.
      - name: Rsync to Hostinger
        run: |
          # Hostinger's SSH ingress occasionally drops the initial handshake
          # (intermittent "Connection timed out"), failing an otherwise-good
          # deploy. Retry up to 3 times with SSH keepalives + a connect
          # timeout so a transient blip self-heals instead of needing a manual
          # re-run. Only a genuine 3x failure fails the step.
          ok=0
          for attempt in 1 2 3; do
            echo "Rsync attempt $attempt of 3…"
            if rsync -avz --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='tests/' \
              --exclude='wp-plugin/' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='database/database.sqlite' \
              --exclude='database/*.sqlite-journal' \
              --exclude='storage/app/public/avatars/' \
              --exclude='storage/app/public/pos_products/' \
              --exclude='storage/app/public/pos_categories/' \
              --exclude='storage/app/public/partners/' \
              --exclude='storage/app/public/company/' \
              --exclude='storage/app/public/whatsapp-receipts/' \
              --exclude='storage/app/public/pos/' \
              --exclude='storage/app/public/accounts/' \
              --exclude='storage/app/public/employee_agreements/' \
              --exclude='storage/app/public/rental_vehicles/' \
              --exclude='storage/app/public/rental_orders/' \
              --exclude='storage/app/public/rental_deposits/' \
              --exclude='storage/app/public/rental_customers/' \
              --exclude='storage/app/public/limo_petty/' \
              --exclude='storage/app/workspaces/' \
              --exclude='storage/app/backups/' \
              --exclude='storage/app/imports/' \
              --exclude='storage/app/private/video-chunks/' \
              --exclude='storage/app/private/whatsapp-assistant-chat/' \
              --exclude='storage/logs/' \
              --exclude='storage/framework/cache/data/' \
              --exclude='storage/framework/sessions/' \
              --exclude='storage/framework/views/' \
              --exclude='storage/framework/testing/' \
              --exclude='public/storage' \
              --exclude='public/hot' \
              -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
              ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/; then
              ok=1
              break
            fi
            echo "Rsync attempt $attempt failed; retrying in 20s…"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "Rsync failed after 3 attempts (Hostinger SSH unreachable)."
            exit 1
          fi

      # Remote post-deploy: link storage, run pending migrations (core +
      # POS module), seed real cashier accounts, re-sync POS view arch,
      # then rebuild caches.
      #
      # Per project memory `post-install-module-migrations-not-auto-applied`,
      # module migrations live outside Laravel's default migrate path — we
      # opt EACH installed module in explicitly here so a future column add
      # doesn't sit Pending on prod. (Inventory was missing — a later
      # stock_moves.item_type add never ran, 500-ing recipe sales — fixed
      # 2026-06-24 by adding its --path below.)
      #
      # `db:seed --class=PosStaffSeeder --force` creates the three real
      # POS cashier accounts (ramadan / faraj / osama, pos_user group,
      # no email). The seeder is `updateOrCreate`-keyed by name so re-runs
      # are idempotent — kept OUT of the default seed chain because tests
      # using DatabaseMigrations + null-email users trip migrate:rollback
      # (memory: null-email-seed-breaks-migrate-rollback).
      - name: Remote post-deploy
        run: |
          # ln -sfn (not `php artisan storage:link`) — Hostinger disables
          # PHP's exec() in shared-hosting php.ini, and Laravel's storage:link
          # shells out via exec() to create the symlink. The OS-level `ln`
          # bypasses that restriction. -s = symbolic, -f = replace existing,
          # -n = don't follow the target if dst is already a symlink (avoids
          # accidentally creating a link inside an existing link target).
          # Like the rsync step, Hostinger's SSH ingress can drop the handshake
          # (or the connection mid-chain), failing an otherwise-good deploy with
          # no migration changes pending. Every remote command below is
          # idempotent (migrate --force, idempotent seeders, module
          # resync/install, cache rebuilds), so retry the whole chain up to 3x —
          # only a genuine 3x failure fails the deploy.
          #
          # The chain ends by resetting the WEB PHP OPcache: `view:cache` runs in
          # the CLI SAPI, so LiteSpeed keeps serving the previous compiled Blade
          # bytecode until its workers recycle — deploys looked "stuck on the old
          # view". We drop a tiny self-deleting `opcache_reset()` script into
          # public/ and curl it (runs under the web SAPI → clears the right
          # cache), then remove it. base64 avoids quoting inside the ssh string.
          ok=0
          for attempt in 1 2 3; do
            echo "Remote post-deploy attempt $attempt of 3…"
            if ssh -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.DEPLOY_PATH }} && \
               ln -sfn ${{ secrets.DEPLOY_PATH }}/storage/app/public ${{ secrets.DEPLOY_PATH }}/public/storage && \
               php artisan migrate --force && \
               php artisan workspaces:migrate && \
               php artisan migrate --path=Modules/Pos/database/migrations --force && \
               php artisan migrate --path=Modules/WhatsApp/database/migrations --force && \
               php artisan migrate --path=Modules/Accounting/database/migrations --force && \
               php artisan migrate --path=Modules/Purchases/database/migrations --force && \
               php artisan migrate --path=Modules/Inventory/database/migrations --force && \
               php artisan migrate --path=Modules/Rental/database/migrations --force && \
               php artisan migrate --path=Modules/Limousine/database/migrations --force && \
               php artisan migrate --path=Modules/WooCommerce/database/migrations --force && \
               php artisan migrate --path=Modules/Contacts/database/migrations --force && \
               php artisan migrate --path=Modules/Project/database/migrations --force && \
               php artisan db:seed --class='Database\\Seeders\\SettingSeeder' --force && \
               php artisan db:seed --class='Database\\Seeders\\PosStaffSeeder' --force && \
               php artisan admin:ensure '${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}' '${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}' --name='Wanaan Admin' && \
               php artisan module:resync pos && \
               php artisan module:resync accounting && \
               php artisan module:resync contacts && \
               php artisan module:resync purchases && \
               php artisan module:resync inventory && \
               php artisan module:install rental && \
               php artisan module:resync rental && \
               php artisan module:install limousine && \
               php artisan module:resync limousine && \
               php artisan module:install woocommerce && \
               php artisan module:install whatsapp && \
               php artisan workspaces:install-modules && \
               php artisan optimize:clear && \
               { php artisan limo:match-driver-names || true; } && \
               php artisan config:cache && \
               php artisan route:cache && \
               php artisan view:cache && \
               php artisan event:cache && \
               echo 'PD9waHAgaWYgKGZ1bmN0aW9uX2V4aXN0cygib3BjYWNoZV9yZXNldCIpKSB7IG9wY2FjaGVfcmVzZXQoKTsgfSBlY2hvICJvayI7IEB1bmxpbmsoX19GSUxFX18pOw==' | base64 -d > public/__cachebust.php && \
               (curl -fsS --max-time 30 https://erp.wanaan-bh.com/__cachebust.php || true) && \
               rm -f public/__cachebust.php"; then
              ok=1
              break
            fi
            echo "Post-deploy attempt $attempt failed; retrying in 20s…"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "Remote post-deploy failed after 3 attempts (Hostinger SSH)."
            exit 1
          fi
