name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect workspaces + locked-user rebind + tail the log
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             echo "=== workspaces table ===" && \
             php artisan tinker --execute="foreach (App\Models\Workspace::query()->get([\"id\",\"name\",\"is_main\",\"database\",\"deleted_at\"]) as \$w) { echo json_encode(\$w).PHP_EOL; }" && \
             echo "=== every locked (home_workspace_id set) user, checked against their tenant file ===" && \
             php artisan tinker --execute="
               foreach (App\Models\User::query()->whereNotNull(\"home_workspace_id\")->get([\"id\",\"name\",\"email\",\"home_workspace_id\",\"is_admin\"]) as \$u) {
                 \$ws = App\Models\Workspace::find(\$u->home_workspace_id);
                 if (\$ws === null) { echo \"user {\$u->id} {\$u->email}: home workspace {\$u->home_workspace_id} NOT FOUND (soft-deleted or missing row)\".PHP_EOL; continue; }
                 \$path = \$ws->databasePath();
                 if (\$path === null || ! is_file(\$path)) { echo \"user {\$u->id} {\$u->email}: workspace {\$ws->id} ({\$ws->name}) file MISSING at \".(\$path ?? \"null\").PHP_EOL; continue; }
                 \$found = App\Erp\Tenancy\WorkspaceManager::class;
                 \$hasRow = app(\$found)->withTenant(\$path, function () use (\$u) { return App\Models\User::query()->where(\"email\", \$u->email)->first([\"id\",\"email\",\"is_admin\"]); });
                 echo \"user {\$u->id} {\$u->email} -> workspace {\$ws->id} ({\$ws->name}): tenant row = \".json_encode(\$hasRow).PHP_EOL;
               }
             " && \
             echo "=== last 150 lines of laravel.log ===" && \
             tail -n 150 storage/logs/laravel.log || echo "(no log file / empty)"'
