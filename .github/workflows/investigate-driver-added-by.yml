name: Investigate driver vs added-by mismatch (manual)

# One-off, read-only diagnostic. The owner flagged booking BK/15392 where the
# Driver column shows "mariam" and Added by shows "hassan", believing the two
# are swapped. This checks whether that is a one-off or a systemic pattern
# across the whole Wanaan booking history, before anything is changed.
# Manual only (workflow_dispatch); never runs on push. Writes nothing.
on:
  workflow_dispatch:

concurrency:
  group: investigate-driver-added-by
  cancel-in-progress: false

jobs:
  investigate:
    name: Investigate on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run diagnostic
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$bs = chr(92);
               \$workspaceClass = \"App\".\$bs.\"Models\".\$bs.\"Workspace\";
               \$wsMgrClass = \"App\".\$bs.\"Erp\".\$bs.\"Tenancy\".\$bs.\"WorkspaceManager\";
               \$legableType = \"Modules\".\$bs.\"Limousine\".\$bs.\"Models\".\$bs.\"LimoBooking\";
               \$all = \$workspaceClass::all();
               \$matches = [];
               foreach (\$all as \$w) { if (str_contains(strtolower(\$w->name), \"wanaan\")) { \$matches[] = \$w; } }
               if (count(\$matches) !== 1) { echo \"AMBIGUOUS OR NONE\".PHP_EOL; exit(1); }
               \$ws = \$matches[0];
               echo \"WORKSPACE \".\$ws->id.\" \".\$ws->name.PHP_EOL;
               \$mgr = app(\$wsMgrClass);
               \$mgr->withTenant(\$ws->databasePath(), function () use (\$legableType) {
                 \$b = DB::table(\"limo_bookings\")->where(\"reference\", \"BK/15392\")->first();
                 if (\$b !== null) {
                   echo \"BOOKING 15392: prepared_by=[\".(\$b->prepared_by ?? \"NULL\").\"] requested_by=[\".(\$b->requested_by ?? \"NULL\").\"]\".PHP_EOL;
                   \$legs = DB::table(\"limo_legs\")->where(\"legable_type\", \$legableType)->where(\"legable_id\", \$b->id)->get([\"driver\",\"vehicle\",\"from_location\",\"to_location\"]);
                   foreach (\$legs as \$l) { echo \"  LEG driver=[\".\$l->driver.\"] vehicle=[\".\$l->vehicle.\"]\".PHP_EOL; }
                 } else {
                   echo \"BOOKING 15392 NOT FOUND\".PHP_EOL;
                 }

                 \$rows = DB::table(\"limo_legs as l\")
                   ->join(\"limo_bookings as b\", \"b.id\", \"=\", \"l.legable_id\")
                   ->where(\"l.legable_type\", \$legableType)
                   ->whereNotNull(\"l.driver\")->where(\"l.driver\", \"!=\", \"\")
                   ->whereNotNull(\"b.prepared_by\")->where(\"b.prepared_by\", \"!=\", \"\")
                   ->get([\"l.driver\", \"b.prepared_by\"]);

                 \$same = 0; \$diff = 0; \$pairs = [];
                 foreach (\$rows as \$r) {
                   \$d = strtolower(trim((string) \$r->driver));
                   \$p = strtolower(trim((string) \$r->prepared_by));
                   if (\$d === \$p) { \$same++; continue; }
                   \$diff++;
                   \$key = \$d.\"||\".\$p;
                   \$pairs[\$key] = (\$pairs[\$key] ?? 0) + 1;
                 }
                 echo \"TOTAL ROWS WITH BOTH FIELDS=\".count(\$rows).\" SAME=\".\$same.\" DIFF=\".\$diff.PHP_EOL;
                 arsort(\$pairs);
                 \$top = array_slice(\$pairs, 0, 30, true);
                 foreach (\$top as \$k => \$c) {
                   \$parts = explode(\"||\", \$k);
                   echo \"PAIR driver=[\".\$parts[0].\"] prepared_by=[\".\$parts[1].\"] count=\".\$c.PHP_EOL;
                 }

                 \$mariamRows = DB::table(\"limo_legs as l\")
                   ->join(\"limo_bookings as b\", \"b.id\", \"=\", \"l.legable_id\")
                   ->where(\"l.legable_type\", \$legableType)
                   ->whereRaw(\"lower(trim(l.driver)) = ?\", [\"mariam\"])
                   ->get([\"b.prepared_by\"]);
                 \$dist = [];
                 foreach (\$mariamRows as \$r) {
                   \$p = strtolower(trim((string) (\$r->prepared_by ?? \"\")));
                   \$dist[\$p] = (\$dist[\$p] ?? 0) + 1;
                 }
                 arsort(\$dist);
                 echo \"MARIAM-AS-DRIVER prepared_by distribution (\".count(\$mariamRows).\" legs):\".PHP_EOL;
                 foreach (\$dist as \$p => \$c) { echo \"  [\".\$p.\"] => \".\$c.PHP_EOL; }

                 \$hassanRows = DB::table(\"limo_legs as l\")
                   ->join(\"limo_bookings as b\", \"b.id\", \"=\", \"l.legable_id\")
                   ->where(\"l.legable_type\", \$legableType)
                   ->whereRaw(\"lower(trim(l.driver)) = ?\", [\"hassan\"])
                   ->get([\"b.prepared_by\"]);
                 \$dist2 = [];
                 foreach (\$hassanRows as \$r) {
                   \$p = strtolower(trim((string) (\$r->prepared_by ?? \"\")));
                   \$dist2[\$p] = (\$dist2[\$p] ?? 0) + 1;
                 }
                 arsort(\$dist2);
                 echo \"HASSAN-AS-DRIVER prepared_by distribution (\".count(\$hassanRows).\" legs):\".PHP_EOL;
                 foreach (\$dist2 as \$p => \$c) { echo \"  [\".\$p.\"] => \".\$c.PHP_EOL; }

                 \$preparedByHassan = DB::table(\"limo_legs as l\")
                   ->join(\"limo_bookings as b\", \"b.id\", \"=\", \"l.legable_id\")
                   ->where(\"l.legable_type\", \$legableType)
                   ->whereRaw(\"lower(trim(b.prepared_by)) = ?\", [\"hassan\"])
                   ->get([\"l.driver\"]);
                 \$dist3 = [];
                 foreach (\$preparedByHassan as \$r) {
                   \$d = strtolower(trim((string) (\$r->driver ?? \"\")));
                   \$dist3[\$d] = (\$dist3[\$d] ?? 0) + 1;
                 }
                 arsort(\$dist3);
                 echo \"HASSAN-AS-PREPARED_BY driver distribution (\".count(\$preparedByHassan).\" legs):\".PHP_EOL;
                 foreach (\$dist3 as \$d => \$c) { echo \"  [\".\$d.\"] => \".\$c.PHP_EOL; }

                 if (Schema::hasTable(\"limo_driver_aliases\")) {
                   \$aliasRows = DB::table(\"limo_driver_aliases\")->whereIn(\"alias\", [\"mariam\", \"hassan\"])->get();
                   foreach (\$aliasRows as \$a) {
                     echo \"ALIAS ROW alias=[\".\$a->alias.\"] driver_id=[\".(\$a->driver_id ?? \"NULL\").\"] is_office=[\".(\$a->is_office ? 1 : 0).\"] auto=[\".(\$a->auto ? 1 : 0).\"] decided_by=[\".(\$a->decided_by ?? \"NULL\").\"]\".PHP_EOL;
                   }
                   if (count(\$aliasRows) === 0) { echo \"NO ALIAS ROWS FOR mariam OR hassan (still fully undecided)\".PHP_EOL; }
                 } else {
                   echo \"NO limo_driver_aliases TABLE\".PHP_EOL;
                 }

                 \$driverNames = DB::table(\"rental_drivers\")->where(function (\$q) {
                   \$q->whereRaw(\"lower(name) like ?\", [\"%mariam%\"])->orWhereRaw(\"lower(name) like ?\", [\"%hassan%\"]);
                 })->get([\"id\", \"name\", \"active\"]);
                 foreach (\$driverNames as \$d) { echo \"REGISTER DRIVER id=\".\$d->id.\" name=[\".\$d->name.\"] active=\".(\$d->active ? 1 : 0).PHP_EOL; }
                 if (count(\$driverNames) === 0) { echo \"NO REGISTER DRIVER NAMED LIKE mariam OR hassan\".PHP_EOL; }
               });
             "'
