name: Remove a user (manual)

# Runs `php artisan user:remove` on the live server. The CLI twin of
# Settings → Users' Delete action, for the case the screen can't serve the
# job — a GLOBAL account (shared across every database) that the Users tab
# only ever lets you delete from Main, never from inside a workspace.
#
# Manual only (workflow_dispatch). It never runs on push.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Login email to remove'
        required: true
      databases:
        description: '"all", or comma-separated workspace ids (Main included)'
        required: true
        default: 'all'

concurrency:
  group: remove-user
  cancel-in-progress: false

jobs:
  remove:
    name: Remove on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run user:remove
        env:
          USER_EMAIL: ${{ inputs.email }}
          USER_DATABASES: ${{ inputs.databases }}
        run: |
          set -euo pipefail

          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan user:remove \
               $(printf '%q' "$USER_EMAIL") \
               --databases=$(printf '%q' "$USER_DATABASES")"
