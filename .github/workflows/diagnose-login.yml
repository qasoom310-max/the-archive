name: Diagnose login issue (manual)

# Diagnostics (and, in the final step, a targeted repair) for "nobody but
# the super admin can sign in". Manual only (workflow_dispatch); never
# runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Repair the 3 accounts orphaned by the pre-fix bug (creates missing Main shells + emails fresh passwords)
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$emails = [\"hasan.fuad@hotmail.com\", \"hamdanabbas98@gmail.com\", \"reservations@wanaan-bh.com\"];
               \$mgr = app(App\Erp\Tenancy\WorkspaceManager::class);
               \$ws = App\Models\Workspace::find(7);
               foreach (\$emails as \$email) {
                 \$existing = App\Models\User::query()->where(\"email\", \$email)->first();
                 if (\$existing !== null) { echo \"SKIP {\$email}: already exists on Main (id={\$existing->id})\".PHP_EOL; continue; }
                 \$tenantUser = \$mgr->withTenant(\$ws->databasePath(), fn () => App\Models\User::query()->where(\"email\", \$email)->first());
                 if (\$tenantUser === null) { echo \"SKIP {\$email}: no tenant row found either\".PHP_EOL; continue; }
                 \$password = \Illuminate\Support\Str::password(16, symbols: false);
                 \$hashed = \Illuminate\Support\Facades\Hash::make(\$password);
                 \$mgr->withMain(fn () => App\Models\User::query()->updateOrCreate([\"email\" => \$email], [\"name\" => \$tenantUser->name, \"password\" => \$hashed]));
                 \$mgr->withTenant(\$ws->databasePath(), function () use (\$tenantUser, \$email, \$password): void {
                   \Illuminate\Support\Facades\Notification::route(\"mail\", \$email)->notify(new App\Notifications\WelcomeCredentials(\$tenantUser->name, \$email, \$password));
                 });
                 echo \"REPAIRED {\$email} ({\$tenantUser->name}) - Main shell created, new password emailed\".PHP_EOL;
               }
             "'
