name: Diagnose login issue (manual)

# Read-only diagnostics for "nobody but the super admin can sign in" -
# tails the log and inspects the users table on Main. Never writes
# anything. Manual only (workflow_dispatch); never runs on push.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-login
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect the specific reported accounts
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan tinker --execute="
               \$emails = [
                 \"hasan.fuad@hotmail.com\", \"hamdanabbas98@gmail.com\", \"reservations@wanaan-bh.com\",
                 \"account@wanaan-bh.com\", \"secretary@wanaan-bh.com\", \"bu7sen_96@hotmail.com\",
               ];
               foreach (\$emails as \$email) {
                 \$exact = App\Models\User::query()->where(\"email\", \$email)->first();
                 \$ci = App\Models\User::query()->whereRaw(\"LOWER(email) = ?\", [strtolower(\$email)])->get();
                 echo \"--- {\$email} ---\".PHP_EOL;
                 if (\$exact === null) {
                   echo \"  NO EXACT MATCH on email column.\".PHP_EOL;
                 } else {
                   echo \"  id={\$exact->id} name=\".\$exact->name.\" admin=\".(\$exact->is_admin?1:0).\" super=\".(\$exact->is_super_admin?1:0).\" paused=\".(\$exact->is_paused?1:0).\" home=\".(\$exact->home_workspace_id ?? \"null\").PHP_EOL;
                   echo \"  password_len=\".strlen((string)\$exact->password).\" password_prefix=\".substr((string)\$exact->password,0,7).\" updated_at=\".\$exact->updated_at.PHP_EOL;
                 }
                 echo \"  case-insensitive matches: \".\$ci->count().\" -> \".\$ci->pluck(\"email\")->implode(\", \").PHP_EOL;
               }
             "'
