name: Car usage report (manual)

# Read-only. Shows, per month, how much limousine money is on trips with and
# without a car assigned, and one car's own rental orders and trips.
# Writes nothing — safe to run as many times as needed. Check the
# run's log for the report.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace id ("" for every database)'
        required: false
        default: '7'
      plate:
        description: 'Plate number (or part of the car name) to print in detail'
        required: false
        default: ''

concurrency:
  group: car-usage
  cancel-in-progress: false

jobs:
  report:
    name: Report on erp.wanaan-bh.com
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run limo:car-usage
        env:
          WS: ${{ inputs.workspace }}
          PLATE: ${{ inputs.plate }}
        run: |
          set -euo pipefail
          case "$WS" in (*[!0-9]*) echo "workspace must be a number or blank"; exit 1;; esac
          OPT=""
          case "$PLATE" in (*[!A-Za-z0-9\ -]*) echo "plate must be letters, digits, spaces or dashes"; exit 1;; esac
          if [ -n "$WS" ]; then OPT="--workspace=$WS"; fi
          if [ -n "$PLATE" ]; then OPT="$OPT --plate='$PLATE'"; fi

          ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan limo:car-usage $OPT"
